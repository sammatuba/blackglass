<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d13" />
  <title>BLACKGLASS — Four Ways to Be Fooled</title>
  <meta name="description" content="A phone-anthology about AI-powered deception in the Philippines. Four stories, one family. The form is the lesson: you cannot see clearly from one position." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-kicker">BLACKGLASS</div>
      <h1 class="splash-title">FOUR <span>WAYS</span></h1>
      <p class="splash-sub">to Be Fooled</p>
      <p class="splash-q">The same people, the same phones, four ordinary stories — three ways a machine wears a face you trust, and one way a feed quietly reshapes the one that scrolls.</p>
      <button class="splash-btn" id="splash-begin">Begin</button>
      <p class="splash-note">Best with sound on. Read with attention.</p>
    </div>
  </div>

  <script src="story.js"></script>
  <script src="assets/artifacts.js"></script>
  <script>
    /* Artifacts live once, at the platform copy (public/artifacts/ in dist);
       the legacy mirror reads them via this shim so dist carries no duplicate.
       Standalone use (opened from play/ or file://) keeps the local assets/.
       The app.js img tags read art.file unchanged. */
    (function () {
      function retarget(base) {
        Object.keys(window.ARTIFACTS || {}).forEach(function (id) {
          var a = window.ARTIFACTS[id];
          if (a && a.file) a.file = base + a.file.replace(/^assets\//, '').replace(/\.png$/, '.webp');
        });
      }
      var probe = window.ARTIFACTS && Object.values(window.ARTIFACTS)[0];
      if (!probe || !probe.file) return;
      var name = probe.file.replace(/^assets\//, '').replace(/\.png$/, '.webp');
      fetch('../../../artifacts/' + name, { method: 'HEAD' })
        .then(function (r) { if (r.ok) retarget('../../../artifacts/'); })
        .catch(function () { /* standalone: keep assets/ */ });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
